name: Procesador Masivo de Facturas SIAT en Lote

on:
  repository_dispatch:
    types: [nueva_factura, procesar_lote]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Limpieza y sincronización diaria automática

jobs:
  procesar_lote_facturas:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🌐 Instalar Google Chrome y Librerías de Visión
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip libgl1-mesa-glx libglib2.0-0 libzbar0
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: 📦 Instalar Dependencias Python (OCR + SIAT)
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf easyocr opencv-python-headless numpy pandas openpyxl selenium webdriver-manager supabase pyzbar requests torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu

      - name: 🚀 Procesar TODAS las Facturas de Supabase Storage en 1 solo ciclo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sfqpptquojlsbeheguff.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmcXBwdHF1b2psc2JlaGVndWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyNDk3ODMsImV4cCI6MjA1NjgyNTc4M30.4qFstq4_k24kQyqNfS_b6QcM_G4S_Q0S1J3-2_S0t0t' }}
          GITHUB_OWNER: "kevopedra-star"
          GITHUB_REPO: "procesador-facturas-siat"
        run: |
          python procesador_siat.py --batch-supabase || python procesar_facturas_py.py --batch-supabase || python python_processor/procesar_facturas_py.py --batch-supabase
