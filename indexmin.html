    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .mono-font { font-family: 'Roboto Mono', monospace; }
        
        /* TABLA TIPO EXCEL */
        .excel-grid {
            border-collapse: separate; 
            border-spacing: 0;
            width: 100%;
            font-size: 11px;
            color: #334155;
            background: white;
            table-layout: auto;
        }
        
        .excel-grid th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 6px 10px;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            border-bottom: 2px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: default;
        }

        .excel-grid th:hover { background-color: #e2e8f0; }

        .excel-grid td {
            padding: 4px 10px;
            border-bottom: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            white-space: nowrap;
            vertical-align: middle;
        }

        .excel-grid tr:nth-child(even) { background-color: #f8fafc; }
        .excel-grid tr:hover td { background-color: #e0f2fe; }

        /* Estilos de Totales (Footer) */
        .total-row td {
            background-color: #1e293b !important;
            color: white;
            font-weight: bold;
            font-family: 'Roboto Mono', monospace;
            border-top: 2px solid #0f172a;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        /* Botón Copiar Columna */
        .col-copy-btn {
            float: right;
            margin-left: 8px;
            opacity: 0.2;
            cursor: pointer;
            transition: all 0.2s;
        }
        .excel-grid th:hover .col-copy-btn { opacity: 1; color: #2563eb; }

        .num-cell { text-align: right; font-family: 'Roboto Mono', monospace; }
        .text-cell { text-align: left; }
        
        /* Links en tabla */
        .link-cell a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
        }
        .link-cell a:hover { color: #1d4ed8; }

        #sidebar { transition: margin-left 0.3s ease-in-out; }
        .sidebar-hidden { margin-left: -20rem; }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Scrollbar especial para las áreas de texto */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://sfqpptquojlsbeheguff.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmcXBwdHF1b2psc2JlaGVndWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzgzNzAsImV4cCI6MjEwNDgxNDM3MH0.h-wOCnoz6KW8CdGBRowuWJIvknk_sEJ-_2HLx7SC1ek';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let globalDB = [];
        let processedResults = [];
        let isSidebarOpen = true;
        let globalNitMap = {}; 
        
        // Configuración Regional
        let currentDecimalSeparator = '.'; 
        let currentDateFormat = 'DD/MM/YYYY';

        const sumColumns = ['H1IVA', 'H1GA', 'H1CIFBS', 'H1CIFUSD', 'H1CAV', 'ALM', 'ALM2', 'COUR', 'TRANS', 'PUERT'];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarOpen ? sidebar.classList.add('sidebar-hidden') : sidebar.classList.remove('sidebar-hidden');
            isSidebarOpen = !isSidebarOpen;
        }

        // --- CONFIG REGIONAL ---
        function setDecimalSeparator(sep) {
            currentDecimalSeparator = sep;
            document.getElementById('btnDecDot').className = sep === '.' ? 'flex-1 py-1 text-[10px] font-bold bg-blue-600 text-white transition-colors' : 'flex-1 py-1 text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-colors';
            document.getElementById('btnDecComma').className = sep === ',' ? 'flex-1 py-1 text-[10px] font-bold bg-blue-600 text-white transition-colors' : 'flex-1 py-1 text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-colors';
            if (processedResults.length > 0) renderTable(processedResults);
        }

        function setDateFormat(fmt) {
            currentDateFormat = fmt;
            document.getElementById('btnDateDMY').className = fmt === 'DD/MM/YYYY' ? 'flex-1 py-1 text-[10px] font-bold bg-blue-600 text-white transition-colors' : 'flex-1 py-1 text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-colors';
            document.getElementById('btnDateMDY').className = fmt === 'MM/DD/YYYY' ? 'flex-1 py-1 text-[10px] font-bold bg-blue-600 text-white transition-colors' : 'flex-1 py-1 text-[10px] font-bold text-slate-600 hover:bg-slate-50 transition-colors';
            if (processedResults.length > 0) renderTable(processedResults);
        }

        function formatMoneyCustom(amount) {
            const num = parseFloat(amount) || 0;
            if (currentDecimalSeparator === ',') {
                return num.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else {
                return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        function formatDateCustom(dateString) {
            if (!dateString || dateString === '-') return '';
            let year, month, day;
            if (dateString.includes('-')) {
                [year, month, day] = dateString.split('-');
            } else if (dateString.includes('/')) {
                [day, month, year] = dateString.split('/');
            }
            if (!year || !month || !day) return dateString;
            return currentDateFormat === 'DD/MM/YYYY' ? `${day}/${month}/${year}` : `${month}/${day}/${year}`;
        }

        function extractNitFromUrl(url) {
            if(!url) return null;
            try {
                if (url.includes('nit=')) {
                    const match = url.match(/nit=([^&]+)/);
                    if(match && match[1]) return match[1];
                }
                const urlObj = new URL(url);
                return urlObj.searchParams.get('nit');
            } catch (e) { return null; }
        }

        function getInvoiceCode(f) {
            const nit = extractNitFromUrl(f.codigo_qr);
            if (nit && globalNitMap[nit]) {
                return globalNitMap[nit];
            }
            if (f.interno_archivo && f.interno_archivo.trim().length > 0) {
                return f.interno_archivo;
            }
            return '-'; 
        }

        window.onload = async () => {
            document.getElementById('loader-mini').classList.remove('hidden');
            await loadAllData();
            document.getElementById('loader-mini').classList.add('hidden');
        };

        async function loadAllData() {
            try {
                const [resDims, resFacturas, resSaved, resNits] = await Promise.all([
                    supabaseClient.from('importaciones').select('*'),
                    supabaseClient.from('facturas').select('*'),
                    supabaseClient.from('reporte_unificado_data').select('*'),
                    supabaseClient.from('config_nits').select('*')
                ]);

                if (resDims.error) throw resDims.error;

                const dims = resDims.data;
                const facturas = resFacturas.data;
                const savedData = resSaved.data || [];
                const savedMap = {};
                savedData.forEach(s => savedMap[s.dim_id] = s);
                
                globalNitMap = {};
                if(resNits.data) resNits.data.forEach(n => globalNitMap[n.nit] = n.codigo);

                globalDB = dims.map(dim => {
                    const saved = savedMap[dim.id] || {};
                    const cleanNum = (str) => (str || '').replace(/[^0-9]/g, '');
                    const dimRefInterna = (dim.n_referencia || '').trim();
                    const dimClean = cleanNum(dim.n_declaracion);
                    const dimSuffix = dimClean.length > 7 ? dimClean.slice(-7) : dimClean;

                    let misFacturas = facturas.filter(f => {
                        const fDoc = cleanNum(f.doc_aduanero || '');
                        const fInterno = (f.interno_archivo || '').trim().toUpperCase();
                        const matchDim = fDoc.includes(dimSuffix) && dimSuffix.length > 4;
                        const matchInterno = dimRefInterna.length > 3 && fInterno.length > 3 && 
                                            (fInterno === dimRefInterna.toUpperCase() || fInterno.includes(dimRefInterna.toUpperCase()));
                        return matchDim || matchInterno;
                    });

                    const fAlbo = misFacturas.filter(f => f.tipo === 'ALBO' || f.tipo === 'DAB');
                    
                    const guiaDim = cleanNum(dim.guia_courier);
                    const listGuia = facturas.filter(f => {
                        if (f.tipo !== 'GUIA') return false;
                        
                        if (guiaDim.length > 4) {
                            const fRef = cleanNum(f.ref_guia || '') + cleanNum(f.interno_archivo || '');
                            if (fRef.includes(guiaDim)) return true;
                        }
                        
                        if (dimRefInterna.length > 3) {
                            const fInterno = (f.interno_archivo || '').trim().toUpperCase();
                            const dInterno = dimRefInterna.toUpperCase();
                            if (fInterno.includes(dInterno) || dInterno.includes(fInterno)) return true;
                        }
                        return false;
                    });
                    
                    const totalTrib = parseFloat(dim.total_tributos || 0);
                    const cifBs = parseFloat(dim.total_cif || 0);
                    const ga = parseFloat(dim.gravamen || 0);
                    const iva = parseFloat(dim.iva || 0);
                    
                    const totalAlboCalc = fAlbo.reduce((a,b)=>a+b.monto,0);
                    const totalGuiaCalc = listGuia.reduce((a,b)=>a+b.monto,0); 

                    return {
                        id: dim.id,
                        referencia: dimRefInterna,
                        n_declaracion: dim.n_declaracion,
                        dim_clean: dimClean,
                        fecha_aceptacion: dim.fecha_aceptacion,
                        oi: dim.oi,
                        cif_bs: cifBs,
                        total_tributos: totalTrib,
                        ga: ga,
                        iva: iva,
                        gastos_puerto: saved.gastos_puerto !== undefined ? saved.gastos_puerto : (dim.gastos_puerto || 0),
                        otros_gastos: saved.otros_gastos !== undefined ? saved.otros_gastos : (dim.otros_gastos || 0),
                        json_puerto: saved.gastos_puerto_json || {},
                        json_otros: saved.otros_gastos_json || {},
                        list_albo: fAlbo,
                        list_guia: listGuia, 
                        monto_albo: saved.total_facturas_albo !== undefined ? saved.total_facturas_albo : totalAlboCalc,
                        monto_ip: saved.total_facturas_ip || 0,
                        monto_guia: saved.total_facturas_guia !== undefined ? saved.total_facturas_guia : totalGuiaCalc,
                        guia_courier: dim.guia_courier
                    };
                });
                console.log("DB Loaded:", globalDB.length);
            } catch (e) { console.error(e); Swal.fire('Error', 'Falla carga DB', 'error'); }
        }

        function processData() {
            const rawInput = document.getElementById('inputInternos').value;
            const mesAnio = document.getElementById('inputMesAnio').value || '012026';

            if (!rawInput.trim()) { Swal.fire('Ojo', 'Faltan DIMS', 'warning'); return; }

            const inputs = rawInput.split(/\r?\n/).map(s => s.trim()).filter(s => s !== "");
            let encontrados = 0;
            let faltantes = 0;
            let arrayFaltantes = []; // Arreglo para guardar a los pelados que no se encontraron
            
            processedResults = inputs.map(input => {
                const searchClean = input.replace(/[^0-9]/g, '');
                const item = globalDB.find(d => (d.dim_clean && d.dim_clean.endsWith(searchClean)) || d.referencia == input);
                
                if (!item) { 
                    faltantes++; 
                    arrayFaltantes.push(input); // Guardamos al compa que faltó
                    return { INTERNO: input, ERROR: true }; 
                }
                encontrados++;

                const dimNumberOnly = (item.n_declaracion || '').replace(/[^0-9]/g, '').slice(-7);
                let aduanaCode = "211";
                const declRaw = item.n_declaracion || '';
                const declParts = declRaw.split(/[^a-zA-Z0-9]/);
                const foundCode = declParts.find(p => p.length === 3 && /^\d+$/.test(p));
                if (foundCode) aduanaCode = foundCode;

                const dimYear = mesAnio.length >= 4 ? mesAnio.slice(-4) : "2026";
                const h1ndim = `${dimYear}${aduanaCode}${dimNumberOnly}`;
                const h1bs = ((item.total_tributos || 0) + 100) * -1;
                const isExp = (item.oi || '').toUpperCase() === 'EXP';
                const h1sist = isExp ? 0 : 100;
                const control = h1bs + (item.iva||0) + (item.ga||0) + h1sist;
                const cifUsd = (item.cif_bs || 0) / 6.96;
                
                let h1cav = 0;
                if (isExp) h1cav = 700;
                else if (cifUsd === 0) h1cav = 100;
                else if (cifUsd <= 35000) h1cav = 600;
                else if (cifUsd <= 500000) h1cav = cifUsd * 0.003 * 6.96;
                else if (cifUsd <= 1000000) h1cav = cifUsd * 0.0025 * 6.96;
                else h1cav = 0;

                const joinCodes = (l) => l ? l.map(f => getInvoiceCode(f)).join(' / ') : '';
                const joinF = (l, k) => l ? l.map(x => x[k]||'').join(' / ') : '';
                const fechaClean = (item.fecha_aceptacion || '').split(' ')[0];

                return {
                    H1NDIM: h1ndim,
                    H1BAN: "BUN",
                    H1DOC: dimNumberOnly,
                    H1BS: h1bs,
                    H1FECHA: fechaClean,
                    CONTRATO: `CN1900006${mesAnio}`,
                    H1CODAD: aduanaCode,
                    H1IVA: item.iva,
                    H1GA: item.ga,
                    H1SIST: h1sist,
                    CONTROL: control,
                    H1CIFBS: item.cif_bs,
                    INTERNO: item.referencia, 
                    H1OI: item.oi || '',
                    H1CIFUSD: cifUsd,
                    H1CAV: h1cav,
                    ALM: item.monto_albo, 
                    AB: joinCodes(item.list_albo), 
                    FAC: joinF(item.list_albo, 'n_factura'),
                    FECH: joinF(item.list_albo, 'fecha'),
                    QR: joinF(item.list_albo, 'codigo_qr'),
                    ALM2: item.monto_ip,
                    AB2: "", FAC_IP: "", FECH_IP: "", QR_IP: "",
                    
                    // COURIER (GUÍAS)
                    COUR: item.monto_guia,
                    AB3: joinCodes(item.list_guia), // USA joinCodes (NIT) PARA AB3
                    FAC3: joinF(item.list_guia, 'n_factura'), // AÑADIDO: Numero Factura
                    FECH32: joinF(item.list_guia, 'fecha'), // AÑADIDO: Fecha Factura
                    QR3: joinF(item.list_guia, 'codigo_qr'), // AÑADIDO: QR Guia (QR3)

                    TRANS: item.otros_gastos,
                    AB_OTROS: item.json_otros.cod || '',
                    FAC_OTROS: item.json_otros.nfact || '',
                    FECH_OTROS: item.json_otros.fecha || '',
                    QR_OTROS: item.json_otros.link || '',
                    PUERT: item.gastos_puerto,
                    AB42: item.json_puerto.cod || '',
                    FAC43: item.json_puerto.nfact || '',
                    FECH44: item.json_puerto.fecha || ''
                };
            }).filter(row => !row.ERROR);

            // Actualizamos la UI chida
            document.getElementById('statFound').innerText = encontrados;
            document.getElementById('statMissing').innerText = faltantes;
            document.getElementById('statsBox').classList.remove('hidden');
            
            // Mostrar los que faltaron en el cuadro nuevo
            const missingBox = document.getElementById('missingBox');
            const missingList = document.getElementById('missingList');
            if (faltantes > 0) {
                missingList.value = arrayFaltantes.join('\n');
                missingBox.classList.remove('hidden');
            } else {
                missingBox.classList.add('hidden');
                missingList.value = '';
            }

            if (processedResults.length > 0) {
                renderTable(processedResults);
                if(window.innerWidth < 1024) toggleSidebar();
            } else {
                Swal.fire('¡Híjole!', 'No hubo suerte con la búsqueda, mano. No se encontró ni uno.', 'info');
            }
        }

        // Función nueva pa' copiar la lista de los que faltan
        function copyMissing() {
            const text = document.getElementById('missingList').value;
            if (!text) return;
            
            const textarea = document.createElement("textarea");
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
                Toast.fire({ icon: 'success', title: '¡Lista copiada!' });
            } catch (err) {
                console.error('Error al copiar', err);
                Swal.fire('Error', 'No se pudo copiar, compa.', 'error');
            }
            document.body.removeChild(textarea);
        }

        function renderTable(data) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const tfoot = document.getElementById('tableFoot');
            const table = document.getElementById('resultTable');
            const empty = document.getElementById('emptyState');
            const btnCopy = document.getElementById('btnCopy');
            const btnExcel = document.getElementById('btnExcel');
            const cards = document.getElementById('summaryCards');

            // 1. Columnas y Headers
            // AÑADIDO FAC3, FECH32, QR3 a las listas correspondientes
            const numericCols = ['H1BS', 'H1IVA', 'H1GA', 'H1SIST', 'CONTROL', 'H1CIFBS', 'H1CIFUSD', 'H1CAV', 'ALM', 'ALM2', 'COUR', 'TRANS', 'PUERT'];
            const dateCols = ['H1FECHA', 'FECH', 'FECH_IP', 'FECH32', 'FECH_OTROS', 'FECH44'];
            const textCols = ['H1NDIM', 'H1DOC', 'CONTRATO', 'H1CODAD', 'AB', 'AB2', 'AB3', 'FAC', 'FAC_IP', 'FAC3', 'AB_OTROS', 'FAC_OTROS', 'AB42', 'FAC43'];
            const qrCols = ['QR', 'QR_IP', 'QR3', 'QR_OTROS'];

            const headers = Object.keys(data[0]);
            thead.innerHTML = "<tr>" + headers.map(h => `
                <th onclick="copyColumn('${h}')" title="Copiar columna">
                    ${h} <i class="fa-solid fa-copy col-copy-btn"></i>
                </th>
            `).join('') + "</tr>";

            // 2. Totales
            const totals = {};
            sumColumns.forEach(col => totals[col] = 0);
            
            // 3. Body
            let bodyHtml = '';
            data.forEach(row => {
                bodyHtml += "<tr class='hover:bg-blue-50'>";
                headers.forEach(key => {
                    let val = row[key];
                    let cellHtml = "";
                    
                    if (numericCols.includes(key)) {
                        const valNum = parseFloat(val) || 0;
                        if (sumColumns.includes(key)) totals[key] += valNum;
                        cellHtml = `<td class="num-cell">${formatMoneyCustom(valNum)}</td>`;
                    } else if (dateCols.includes(key)) {
                        cellHtml = `<td class="text-cell">${formatDateCustom(val)}</td>`;
                    } else if (qrCols.includes(key)) {
                        if (!val || val === '' || val === ' / ') {
                            cellHtml = `<td class="text-center text-gray-300">-</td>`;
                        } else {
                            const links = val.split(' / ');
                            let label = 'Ver';
                            if (key === 'QR' && row['FAC']) label = row['FAC'].split(' / ')[0]; 
                            else if (key === 'QR3' && row['FAC3']) label = row['FAC3'].split(' / ')[0]; // Etiqueta para QR3
                            else if (key === 'QR_OTROS' && row['FAC_OTROS']) label = row['FAC_OTROS'];
                            
                            cellHtml = `<td class="link-cell text-center"><a href="${links[0]}" target="_blank">${label}</a></td>`;
                        }
                    } else {
                        cellHtml = `<td class="text-cell">${val}</td>`;
                    }
                    bodyHtml += cellHtml;
                });
                bodyHtml += "</tr>";
            });
            tbody.innerHTML = bodyHtml;

            // 4. Footer (Totales)
            let footHtml = "<tr>";
            headers.forEach((key, index) => {
                if (index === 0) {
                    footHtml += `<td>TOTALES</td>`;
                } else if (sumColumns.includes(key)) {
                    footHtml += `<td class="num-cell text-yellow-400 bg-slate-800">${formatMoneyCustom(totals[key])}</td>`;
                } else {
                    footHtml += `<td></td>`;
                }
            });
            footHtml += "</tr>";
            tfoot.innerHTML = footHtml;

            // 5. Update Cards
            const totalLogistica = totals['ALM'] + totals['ALM2'] + totals['COUR'] + totals['TRANS'] + totals['PUERT'];
            
            document.getElementById('cardTotalLogistica').innerText = formatMoneyCustom(totalLogistica);
            document.getElementById('cardTotalCIF').innerText = formatMoneyCustom(totals['H1CIFBS']);
            document.getElementById('cardTotalCAV').innerText = formatMoneyCustom(totals['H1CAV']);

            table.classList.remove('hidden');
            empty.classList.add('hidden');
            cards.classList.remove('hidden');
            document.getElementById('rowCountBadge').classList.remove('hidden');
            document.getElementById('rowCountBadge').innerText = `${data.length} Filas`;
            btnCopy.classList.remove('hidden');
            btnExcel.classList.remove('hidden');
        }

        // COPIAR COLUMNA INDIVIDUAL (Con formato raw para links)
        function copyColumn(key) {
            const numericCols = ['H1BS', 'H1IVA', 'H1GA', 'H1SIST', 'CONTROL', 'H1CIFBS', 'H1CIFUSD', 'H1CAV', 'ALM', 'ALM2', 'COUR', 'TRANS', 'PUERT'];
            const dateCols = ['H1FECHA', 'FECH', 'FECH_IP', 'FECH32', 'FECH_OTROS', 'FECH44'];

            const textData = processedResults.map(row => {
                let val = row[key];
                if (numericCols.includes(key)) return formatMoneyCustom(val);
                if (dateCols.includes(key)) return formatDateCustom(val);
                return val;
            }).join('\n');

            // NEW (Fix):
            const textarea = document.createElement("textarea");
            textarea.value = textData;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500 });
                Toast.fire({ icon: 'success', title: `Columna "${key}" copiada` });
            } catch (err) {
                console.error('Error al copiar', err);
                Swal.fire('Error', 'No se pudo copiar.', 'error');
            }
            document.body.removeChild(textarea);
        }

        function copyTable() {
            const table = document.getElementById('resultTable');
            if (!table) return;
            const range = document.createRange();
            range.selectNode(table);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
            Swal.fire({ icon: 'success', title: 'Tabla Copiada', text: 'Pégala en Excel con confianza, compa.', timer: 1500, showConfirmButton: false });
        }

        function downloadExcel() {
            if (processedResults.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(processedResults);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte Cliente");
            XLSX.writeFile(wb, "Reporte_Cliente_Final.xlsx");
        }
    </script>
</body>
