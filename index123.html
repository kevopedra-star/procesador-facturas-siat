        const supabaseAudit = supabase.createClient(SUPABASE_URL_AUDIT, SUPABASE_KEY_AUDIT);

        window.registrarAuditoria = async function(accion, modulo, detalle) {
            try {
                const usuarioActual = localStorage.getItem('usuarioActivo') || 'Desconocido'; 
                let ipCliente = 'Desconocida';
                try {
                    const ipResponse = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipResponse.json();
                    ipCliente = ipData.ip;
                } catch (e) {}

                await supabaseAudit.from('bitacora_accesos').insert([{
                    usuario: usuarioActual,
                    accion: accion,
                    modulo: modulo,
                    detalle_consulta: detalle,
                    ip: ipCliente
                }]);
            } catch (err) { /* Silencioso para no estorbar la UX */ }
        };

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('a, div, li, button').forEach(el => {
                    const onclickText = el.getAttribute('onclick') || '';
                    if(onclickText.includes('.html')) {
                        el.addEventListener('click', () => {
                            const nombreModulo = el.innerText.trim() || 'Módulo Interno';
                            window.registrarAuditoria('Consulta', nombreModulo, 'Abrió la vista del módulo');
                        });
                    }
                });
            }, 1000);
        });

    <script>
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());

            document.addEventListener('keydown', function(e) {
                if (
                    e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                    (e.ctrlKey && e.key.toUpperCase() === 'U')
                ) {
                    e.preventDefault();
                    return false;
                }
            });

            let devToolsAbiertas = false;
            
            const atraparMetiches = function() {
                if (devToolsAbiertas) return;
                const start = new Date().getTime();
                debugger; 
                const end = new Date().getTime();

                if (end - start > 100) {
                    devToolsAbiertas = true;
                    window.registrarAuditoria('Alerta de Seguridad', 'Seguridad Core', '⚠️ Intentó abrir DevTools');

                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100vw; background-color:#020617; color:#ef4444; text-align:center; font-family:'Inter', sans-serif; z-index:999999;">

                            <p style="font-size:1.25rem; color:#f87171; max-width: 600px;">Se detectó un intento no autorizado. Tu IP ha sido registrada.</p>
                            <button onclick="window.location.reload()" style="margin-top:40px; padding:12px 30px; background-color:#dc2626; color:white; border-radius:8px; font-weight:bold;">Recargar</button>
                        </div>
                    `;
                }
            };

            setInterval(atraparMetiches, 500);
            setInterval(() => {
                if(window.console && window.console.clear) {
                    window.console.clear();
                    console.log("%c⚠️ ALTO AHÍ ⚠️", "color: red; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 0 #000;");
                }
            }, 1000);
        })();
    </script>

    <!-- SCRIPT DE LÓGICA PRINCIPAL (MODIFICADO) -->
    <!-- ========================================== -->
    <script>
        const loginOverlay = document.getElementById('loginOverlay');
        const mainLayout = document.getElementById('mainLayout');
        const loginForm = document.getElementById('loginForm');
        const timeoutMessage = document.getElementById('timeoutMessage');
        const errorMessage = document.getElementById('errorMessage');
        const btnIngresar = document.getElementById('btnIngresar');
        
        // Revisar si ya hay sesión activa con Supabase
        async function checkSession() {
            const { data: { session } } = await supabaseAudit.auth.getSession();
            if (session) {
                iniciarApp(session.user.email);
            }
        }
        checkSession();

        // ==========================================
        // 🔐 LÓGICA ESTRICTA DE LOGIN CON SUPABASE (AUTH OFICIAL)
        // ==========================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            
            if (email && password) {
                // Estado de carga (para que se vea pro)
                const textoOriginalBtn = btnIngresar.innerHTML;
                btnIngresar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando...';
                btnIngresar.disabled = true;
                errorMessage.classList.add('hidden');
                timeoutMessage.classList.add('hidden');

                try {
                    // 👇 AQUÍ USAMOS LA LÓGICA DE AUTH DE SUPABASE (como en el archivo que subiste)
                    const { data, error } = await supabaseAudit.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) {
                        // SI NO HAY MATCH EXACTO -> PA' FUERA
                        errorMessage.classList.remove('hidden');
                        btnIngresar.innerHTML = textoOriginalBtn;
                        btnIngresar.disabled = false;
                        document.getElementById('passwordInput').value = ''; // limpiamos contraseña
                        window.registrarAuditoria('Fallo de Login', 'Seguridad', `Intento fallido para: ${email}`);
                    } else {
                        // SI TODO CHIDO -> ADENTRO
                        btnIngresar.innerHTML = textoOriginalBtn;
                        btnIngresar.disabled = false;
                        iniciarApp(data.user.email);
                    }
                } catch (err) {
                    // Por si se cae el internet
                    errorMessage.innerHTML = '<i class="fa-solid fa-wifi mr-1"></i> Error de conexión. Intenta de nuevo.';
                    errorMessage.classList.remove('hidden');
                    btnIngresar.innerHTML = textoOriginalBtn;
                    btnIngresar.disabled = false;
                }
            }
        });

        // ==========================================
        // CORRECCIÓN DEL ERROR "UNEXPECTED END OF INPUT"
        // ==========================================
        function iniciarApp(user) {
            document.getElementById('userNameLabel').innerText = user;
            loginOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loginOverlay.classList.add('hidden');
                mainLayout.classList.remove('hidden');
                window.registrarAuditoria('Consulta', 'Menú Principal', 'Inició sesión en el sistema');
                iniciarTemporizadorInactividad(); 
            }, 700); 
        }

        async function cerrarSesionUsuario() {
            window.registrarAuditoria('Consulta', 'Menú Principal', 'Cerró sesión manualmente');
            await supabaseAudit.auth.signOut();
            window.location.reload();
        }

        // ==========================================
        // ⏳ SISTEMA ESTRICTO DE CIERRE POR INACTIVIDAD (30 MIN)
        // ==========================================
        let inactividadTimer;
        // 30 minutos = 30 * 60 * 1000 milisegundos
        const TIEMPO_MAXIMO_INACTIVIDAD = 30 * 60 * 1000; 

        async function cerrarPorInactividad() {
            window.registrarAuditoria('Cierre Automático', 'Seguridad Core', 'Sesión expirada tras 30 min de inactividad');
            await supabaseAudit.auth.signOut();
            
            // Ocultamos la app y sacamos el login
            mainLayout.classList.add('hidden');
            loginOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            timeoutMessage.classList.remove('hidden');
            
            // Limpiamos los inputs
            document.getElementById('passwordInput').value = '';
            
            // Vaciamos el iframe para que no quede nada a la vista
            document.getElementById('mainFrame').src = 'about:blank';
        }

        function reiniciarTemporizador() {
            if (!mainLayout.classList.contains('hidden')) {
                clearTimeout(inactividadTimer);
                // Si el usuario hace cualquier cosa, los 30 minutos arrancan de nuevo desde cero
                inactividadTimer = setTimeout(cerrarPorInactividad, TIEMPO_MAXIMO_INACTIVIDAD);
            }
        }

        function iniciarTemporizadorInactividad() {
            reiniciarTemporizador();
            
            // Vigilar si la nena mueve el mouse o teclea algo
            ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
                window.addEventListener(evt, reiniciarTemporizador);
            });

            // Vigilar también dentro de los iframes (los módulos)
            const iframe = document.getElementById('mainFrame');
            iframe.addEventListener('load', () => {
                try {
                    const iframeWindow = iframe.contentWindow;
                    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
                        iframeWindow.addEventListener(evt, reiniciarTemporizador);
                    });
                } catch(e) {
                    // Por si hay temas de CORS (cross-origin), lo ignoramos suavecito
                }
            });
        }

        // ==========================================
        // LÓGICA DEL SIDEBAR (Menú lateral)
        // ==========================================
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');
        let isExpanded = false;

        toggleBtn.addEventListener('click', () => {
            isExpanded = !isExpanded;
            if (isExpanded) {
                sidebar.classList.remove('w-[84px]');
                sidebar.classList.add('w-64');
                toggleIcon.classList.remove('fa-chevron-right');
                toggleIcon.classList.add('fa-chevron-left');
                sidebarTexts.forEach(text => {
                    text.classList.remove('opacity-0', '-translate-x-4', 'invisible');
                    text.classList.add('opacity-100', 'translate-x-0');
                    text.style.width = 'auto';
                });
            } else {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-[84px]');
                toggleIcon.classList.remove('fa-chevron-left');
                toggleIcon.classList.add('fa-chevron-right');
                sidebarTexts.forEach(text => {
                    text.classList.remove('opacity-100', 'translate-x-0');
                    text.classList.add('opacity-0', '-translate-x-4');
                    setTimeout(() => {
                        if (!isExpanded) { text.classList.add('invisible'); text.style.width = '0px'; }
                    }, 300);
                });
            }
        });

        function activarMenu(element) {
            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('bg-slate-800', 'text-white', 'bg-emerald-900/20', 'text-emerald-300');
            });
            if(element.href.includes('auditoria_accesos')) {
                element.classList.add('bg-emerald-900/20', 'text-emerald-300');
            } else {
                element.classList.add('bg-slate-800', 'text-white');
            }
        }
    </script>
</body>
</html>
